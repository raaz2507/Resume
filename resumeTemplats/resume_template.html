<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>khushi Resume</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        .page{
            width:210mm;
            height: 297mm;
            border:1px solid black;
            box-shadow: -2px -2px 13px -2px black;
            margin: auto;
            overflow: hidden;
        }
        aside{
            width:35%;
            height: 100%;
        }
        aside .upper_box{
            width:100%;
            height:18%;
            background-color: rgb(71, 71, 71);
            /* margin-bottom: -10%; */
        }
        aside .upper_box{
            padding: 15% 0 0 20%;
            position: relative;
            background-color: black;
            clip-path: polygon(0 0, 0 90%, 80% 100%, 100% 0);
            z-index: 0;
        }
        aside .upper_box::after{
            position: absolute;
            top:0;
            left:0;
            content: "";
            width:100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.15);
            clip-path: polygon(0 0, 0 90%, 80% 100%, 90% 0);
        }
        aside .upper_box .qr_link{
            width:100px;
            height: 100px;
            border: 2px solid black;
            border-radius: 50%;
        }
        aside .upper_box .qr_link img{
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        aside .riban{
            /* border: 1px solid red; */
            width: 150%;
            margin-top: -10%;
            margin-bottom: -13%;
            z-index: 1;
            position: relative;
        }
        aside .lower_box{
            width: 90%;
            height: 100%;
            background-color: black;
            clip-path: polygon(0 2%, 0 100%, 90% 100%, 100% 0);
            position: relative;
        }
        aside .lower_box::after{
            position: absolute;
            top:0;
            left:0;
            width:100%;
            height: 100%;
            content: "";
            background-color: rgba(255, 255, 255, 0.15);
            clip-path: polygon(0 2%, 0 100%, 70% 100%, 100% 0);
        }
    </style>
    <style>
        .container{
             border: 1px solid black;
        }
        .box{
            background-color: rgb(64, 0, 89);
            margin:auto;
            width:max-content;
            height: auto;
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            color: white;
            padding: 10% 2% 30%;
            position: relative;
           
        }
        .box::after{
            content: "TEMPLATE";
            background-color: red;
            width: 110%;
            height: auto;
            position: absolute;
            top:50%;
            left:-5%;
            text-align: center;
            font-weight: 500;
            /* transform: translate(0% , 50%); */
        }
        .profile_pic_container{
            position: absolute;
            bottom:0;
            left:50%;
            width:100px;
            border:1px solid red;
        }
    </style>
</head>
<body>
    <div class="page">
        <aside>
            <div class="upper_box">
                <div class="qr_link">
                    <img src="./qrcode.svg" alt="QR code">
                </div>
            </div>
            
            <div class="riban">
                <img src="./riban.svg" alt=""> 
            </div>
            <div class="lower_box">
                d
            </div>
        </aside>
           
    </div>
    <div class="page">
        <div class="container">
            <div class="box">
                online CV
                <div class="profile_pic_container">
                    <img src="./" alt="photo">
                </div>
            </div>
            
        </div>
    </div>
    
</body>
</html>
